name: build-portable

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable build
        run: dotnet publish src/Sexy.WinUI/Sexy.WinUI.csproj -c Release -r win-x64 --self-contained true -o artifacts/Sexy-Portable

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sexy-portable
          path: artifacts/Sexy-Portable
          if-no-files-found: error
          retention-days: 30
